<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="index.css/style.css">
</head>
<body>

    <h1>Student Registration Form</h1>

    <form>
        <div class="form-row">
            <label for="roll">Roll no. :</label>
            <input type="text" id="roll" name="roll">
        </div>

        <div class="form-row">
            <label>Student name :</label>
            <div class="inline">
                <input type="text" placeholder="First Name">
                <span>-</span>
                <input type="text" placeholder="Last Name">
            </div>
        </div>

        <div class="form-row">
            <label for="father">Father's name :</label>
            <input type="text" id="father" name="father">
        </div>

        <div class="form-row">
            <label>Date of birth :</label>
            <div class="inline dob">
                <input type="number" placeholder="Day">
                <span>-</span>
                <input type="number" placeholder="Month">
                <span>-</span>
                <input type="number" placeholder="Year">
                <i>(DD-MM-YYYY)</i>
            </div>
        </div>

        <div class="form-row">
            <label for="mobile">Mobile no. :</label>
            <div class="inline">
                <input class="code" type="text" value="+880" readonly>
                <span>-</span>
                <input type="tel" id="mobile">
            </div>
        </div>

        <div class="form-row">
            <label for="email">Email id :</label>
            <input type="email" id="email">
        </div>

        <div class="form-row">
            <label for="password">Password :</label>
            <input type="password" id="password">
        </div>

        <div class="form-row">
            <label>Gender :</label>
            <div class="options">
                <label><input type="radio" name="gender"> Male</label>
                <label><input type="radio" name="gender"> Female</label>
            </div>
        </div>

        <div class="form-row">
            <label>Department :</label>
            <div class="options">
                <label><input type="checkbox"> CSE</label>
                <label><input type="checkbox"> IT</label>
                <label><input type="checkbox"> ECE</label>
                <label><input type="checkbox"> Civil</label>
                <label><input type="checkbox"> Mech</label>
            </div>
        </div>

        <div class="form-row">
            <label for="course">Course :</label>
            <select id="course">
                <option value="">Select Current Course's</option>
                <option>HTML</option>
                <option>CSS</option>
                <option>JavaScript</option>
                <option>Web Development</option>
                <option>Python</option>
            </select>
        </div>

        <div class="form-row">
            <label for="photo">Student photo :</label>
            <input type="file" id="photo" accept="image/*">
        </div>

        <div class="form-row">
            <label for="city">City :</label>
            <input type="text" id="city">
        </div>

        <div class="form-row">
            <label for="address">Address :</label>
            <textarea id="address"></textarea>
        </div>

        <div class="submit">
            <button type="submit">Register</button>
        </div>
    </form>

</body>
</html>
